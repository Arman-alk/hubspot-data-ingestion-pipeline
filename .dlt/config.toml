# DLT runtime configuration
[runtime]
log_level = "WARNING"
dlthub_telemetry = true

# Parallel execution across resources
[extract]
workers = 4

[normalize]
workers = 4

[load]
workers = 4

# MinIO filesystem destination
[destination.filesystem]
bucket_url = "s3://hubspot-data/hubspot"
layout = "{table_name}/year={YYYY}/month={MM}/{load_id}.{file_id}.{ext}"
